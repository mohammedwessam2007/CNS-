<title>Neck in Layers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<style>
/* Layout: an app screen. A live 3D stage of the neck (C3 to C7) fills the left; a glass lesson panel floats
   on the right; on narrow screens the stage sits on top and the panel scrolls beneath it.
   One dark world, lit like a scanner bay; each fascial layer keeps its own colour everywhere it appears. */
:root {
  color-scheme: dark;
  --void: #04060b;
  --deep: #0b1120;
  --glass: rgba(18, 24, 38, 0.62);
  --line: rgba(190, 210, 255, 0.14);
  --line-2: rgba(190, 210, 255, 0.26);
  --text: #eef2fb;
  --text-2: #a8b2c8;
  --text-3: #6d7891;
  --investing: #f2b45a;
  --pretracheal: #f07a95;
  --prevertebral: #4fd1b5;
  --carotid: #7ea6ff;
  --superficial: #d9dfea;
  --artery: #ff5a4e;
  --vein: #5577e6;
  --nerve: #ffd36e;
  --sans: "Geist", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  --mono: "Geist Mono", "SF Mono", Menlo, monospace;
  --arabic: "Noto Naskh Arabic", "Geeza Pro", serif;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--void); color: var(--text); font: 400 16px/1.6 var(--sans);
  padding-block: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(360px, 440px); gap: 18px; padding-block: 14px; box-sizing: border-box; }

/* stage */
.stage { position: relative; min-height: 0; border-radius: 26px; overflow: hidden; isolation: isolate;
  background: radial-gradient(120% 90% at 50% 38%, #142038 0%, #0a101d 46%, var(--void) 100%);
  box-shadow: 0 0 0 1px var(--line) inset; }
.stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2;
  background: radial-gradient(70% 55% at 50% 50%, transparent 60%, rgba(0, 0, 0, 0.45) 100%); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; z-index: 1; }
.hud { position: absolute; z-index: 4; font: 500 11px/1.4 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3); pointer-events: none; }
.hud b { color: var(--text-2); font-weight: 500; }
.hud.tl { left: 20px; top: 18px; }
.hud.bl { left: 20px; bottom: 18px; display: grid; gap: 3px; }
.hud.tr { right: 20px; top: 18px; text-align: right; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--text); font: 600 13px/1 var(--sans); letter-spacing: 0.02em; text-transform: none; }
.brand i { width: 8px; height: 8px; border-radius: 50%; background: var(--prevertebral); box-shadow: 0 0 12px var(--prevertebral); }
.tools { position: absolute; z-index: 5; right: 16px; bottom: 16px; display: flex; gap: 8px; }
.tools button { font: 500 13px/1 var(--sans); color: var(--text); background: rgba(20, 28, 46, 0.7); border: 1px solid var(--line-2); border-radius: 999px; padding: 10px 14px; cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: background 0.25s, border-color 0.25s; }
.tools button:hover, .tools button[aria-pressed="true"] { background: rgba(60, 80, 130, 0.55); border-color: rgba(190, 210, 255, 0.45); }
.labels { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.tag { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 7px; transform: translate(-50%, -50%); white-space: nowrap;
  font: 500 12.5px/1 var(--sans); color: var(--text); padding: 6px 10px 6px 8px; border-radius: 999px;
  background: rgba(8, 12, 22, 0.72); border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  transition: opacity 0.4s var(--ease); }
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
.tag.hide { opacity: 0; }
.tag.big { font-size: 13.5px; padding: 8px 12px 8px 10px; border-color: color-mix(in srgb, var(--c) 55%, transparent); }
#pick { position: absolute; z-index: 6; left: 0; top: 0; transform: translate(-50%, calc(-100% - 14px)); pointer-events: none; max-width: 250px;
  padding: 10px 13px; border-radius: 14px; background: rgba(8, 12, 22, 0.88); border: 1px solid var(--line-2); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
  opacity: 0; transition: opacity 0.25s; }
#pick.on { opacity: 1; }
#pick b { display: block; font: 600 14px/1.25 var(--sans); }
#pick span { display: block; font-size: 12.5px; line-height: 1.4; color: var(--text-2); margin-top: 3px; }
#pick span:empty { display: none; }
.nogl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--text-2); z-index: 4; }

/* lesson panel */
.panel { min-height: 0; overflow-y: auto; border-radius: 26px; background: var(--glass); box-shadow: 0 0 0 1px var(--line) inset, 0 30px 80px rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); display: flex; flex-direction: column; overscroll-behavior: contain; }
.panel-in { padding: 22px 24px 0; display: grid; gap: 20px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.steps i { height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.1); overflow: hidden; position: relative; }
.steps i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--prevertebral), var(--carotid)); transform: scaleX(var(--p, 0)); transform-origin: left; transition: transform 0.9s var(--ease); }
.meta { display: flex; justify-content: space-between; gap: 10px; font: 500 11.5px/1.3 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); }
.page { display: grid; gap: 18px; transition: opacity 0.3s, transform 0.45s var(--ease); }
.page.out { opacity: 0; transform: translateY(14px); }
h1, h2 { margin: 0; font-weight: 600; letter-spacing: -0.035em; text-wrap: balance; }
h1 { font-size: clamp(34px, 3.6vw, 46px); line-height: 1.02; }
h2 { font-size: clamp(28px, 3vw, 38px); line-height: 1.05; }
.grad { background: linear-gradient(100deg, var(--investing), var(--pretracheal) 45%, var(--carotid)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.ar { font: 700 20px/1.2 var(--arabic); color: var(--text-2); }
.ar small { font: 500 12px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); margin-inline-start: 10px; }
.lede { margin: 0; font-size: 17px; line-height: 1.65; color: var(--text); }
.lede i { font-style: normal; color: var(--text-2); }
.chip { font: inherit; font-weight: 600; color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); border: 0; border-radius: 8px; padding: 1px 7px; cursor: pointer; transition: background 0.25s, box-shadow 0.25s; }
.chip:hover, .chip[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 26%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 60%, transparent); }
button:focus-visible { outline: 2px solid var(--carotid); outline-offset: 2px; }
.layers { display: grid; gap: 8px; }
.layer { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; text-align: left; width: 100%; padding: 12px 14px; border-radius: 16px; cursor: pointer;
  background: rgba(255, 255, 255, 0.035); border: 1px solid rgba(255, 255, 255, 0.07); color: var(--text); font: inherit; transition: background 0.25s, border-color 0.25s; }
.layer:hover, .layer[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 10%, transparent); border-color: color-mix(in srgb, var(--c) 45%, transparent); }
.orb { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c) 40%, white), var(--c) 60%, color-mix(in srgb, var(--c) 40%, black)); box-shadow: 0 0 20px -2px var(--c); }
.layer b { display: block; font-weight: 600; font-size: 15px; }
.layer span { display: block; font-size: 14px; color: var(--text-2); line-height: 1.5; margin-top: 2px; }
.card { border-radius: 18px; padding: 16px 18px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); }
.card .cap { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font: 500 11px/1.2 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--cc, var(--text-3)); margin-bottom: 8px; }
.card .cap [lang="ar"] { font: 700 16px/1 var(--arabic); letter-spacing: 0; text-transform: none; color: var(--text-2); }
.card p { margin: 0; font-size: 15px; }
.q { font-size: 18px !important; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 10px !important; }
.answer { filter: blur(8px); opacity: 0.5; transition: filter 0.6s var(--ease), opacity 0.6s; user-select: none; }
.revealed .answer { filter: none; opacity: 1; user-select: text; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
.ghost { font: 500 14px/1 var(--sans); color: var(--text); background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.14); padding: 11px 16px; border-radius: 999px; cursor: pointer; }
.ghost:hover { background: rgba(255, 255, 255, 0.11); }
.verdict { font-weight: 600; font-size: 14px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.cols h3 { margin: 0 0 6px; font: 500 11px/1.2 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--c); }
.cols ul { margin: 0; padding-left: 16px; display: grid; gap: 5px; font-size: 14.5px; color: var(--text-2); }
.cols li b { color: var(--text); font-weight: 600; }
.go { position: sticky; bottom: 0; margin-top: auto; padding: 18px 24px calc(20px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, rgba(14, 19, 31, 0.98) 55%, rgba(14, 19, 31, 0)); }
.cta { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 17px 20px 17px 22px; border: 0; border-radius: 18px; cursor: pointer;
  color: #06101e; background: linear-gradient(180deg, #ffffff, #dfe7f6); box-shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset, 0 14px 40px -12px rgba(126, 166, 255, 0.7);
  font: 600 17px/1.15 var(--sans); text-align: left; transition: transform 0.2s var(--ease), box-shadow 0.25s; }
.cta:hover { transform: translateY(-1px); box-shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset, 0 18px 50px -12px rgba(126, 166, 255, 0.9); }
.cta:active { transform: scale(0.985); }
.cta small { display: block; font: 500 11.5px/1.2 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: #4a5872; margin-top: 4px; }
.cta [lang="ar"] { font: 700 18px/1 var(--arabic); color: #22314c; }
.cta .arrow { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: #0a1324; color: #fff; flex: none; }

@media (max-width: 900px) {
  body { overflow: hidden; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(260px, 48%) minmax(0, 1fr); gap: 12px; padding-block: 10px; }
  .stage, .panel { border-radius: 22px; }
  .hud.bl { display: none; }
}
@media (max-width: 480px) {
  .panel-in { padding: 18px 18px 0; }
  .go { padding-inline: 18px; }
  .tag { font-size: 11.5px; padding: 5px 9px 5px 7px; }
  .tools button { padding: 9px 12px; font-size: 12px; }
  .hud.tr { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .page, .steps i::after, .answer, .tag { transition: none; }
}
</style>

<div class="app">

    <div class="tools"><button type="button" id="explode" aria-pressed="false">Slide sleeves apart</button><button type="button" id="reset">Reset view</button></div>
  </section>

  <aside class="panel" aria-label="Lesson">

      <div class="steps" aria-hidden="true"><i id="s1"></i><i id="s2"></i><i id="s3"></i></div>

    <div class="go">
      <button type="button" class="cta" id="cta"><span><span id="cta-t">Got it, next section</span><small id="cta-s">The whole picture</small></span><span lang="ar" dir="rtl">فهمتها</span><span class="arrow" aria-hidden="true">→</span></button>
    </div>
  </aside>
</div>

<script>
(function () {
  "use strict";

  var COL = { superficial: "#d9dfea", investing: "#f2b45a", pretracheal: "#f07a95", prevertebral: "#4fd1b5", carotid: "#7ea6ff" };
  var NAME = { superficial: "Superficial fascia", investing: "Investing layer", pretracheal: "Pretracheal layer", prevertebral: "Prevertebral layer", carotid: "Carotid sheath" };

    carotid: "Carotid arteries medially, internal jugular vein laterally, vagus between and behind."

  var NOTE = {
    "Common carotid artery": "Inside the sheath, medially. Splits at the upper border of the thyroid cartilage (C4).",
    "Internal carotid artery": "Continues up inside the carotid sheath.",
    "External carotid artery": "Leaves the sheath at the split. It is not a content of the carotid sheath.",
    "Internal jugular vein": "Inside the sheath, laterally.",
    "Vagus nerve": "Inside the sheath, between and behind the vessels.",
    "Ansa cervicalis": "A loop embedded in the front wall of the sheath, not inside it.",
    "Sympathetic trunk": "Behind the sheath, on the prevertebral fascia. Its middle ganglion sits near C6.",
    "Phrenic nerve": "Runs down on scalenus anterior, under the prevertebral fascia.",
    "Roots of the brachial plexus": "Emerge between scalenus anterior and medius, sheathed by the prevertebral layer as they leave.",
    "Accessory nerve": "Crosses the posterior triangle just under the investing layer.",
    "Vertebral artery": "Climbs through the foramina transversaria from C6 to C1.",
    "Thyroid gland": "In the pretracheal layer, so it rises with swallowing.",
    "Trachea": "C-shaped cartilage rings, open behind.",
    "Oesophagus": "Behind the trachea, a little to the left.",
    "Sternocleidomastoid": "Runs from mastoid to sternum and clavicle, enclosed by the investing layer.",
    "Trapezius": "Enclosed by the investing layer.",

    "Spinal cord": "In the vertebral canal.",

  /* ───── the cross-section, in plate coordinates (one unit = 0.1 mm-ish; 100 units = one scene unit) ───── */

  function scaleAbout(a, k) { var cx = 0, cy = 0; a.forEach(function (p) { cx += p[0]; cy += p[1]; }); cx /= a.length; cy /= a.length; return a.map(function (p) { return [cx + (p[0] - cx) * k, cy + (p[1] - cy) * k]; }); }

      var u = m.userData; if (!u) return;
      u.fade += (u.fadeTo - u.fade) * (1 - Math.pow(0.002, dt));
      u.glow += (u.glowTo - u.glow) * (1 - Math.pow(0.002, dt));
      if (u.holo) { m.uniforms.uOpacity.value = u.base * u.fade; m.uniforms.uGlow.value = u.glow * (0.75 + 0.25 * Math.sin(t * 3)); }
      else {
        var o = u.base * u.fade, want = o < 0.995;
        if (m.transparent !== want) { m.transparent = want; m.depthWrite = !want; m.needsUpdate = true; }
        m.opacity = o;
        if (!u.e0) u.e0 = m.emissive.clone();
        if (u.glow > 0.01) { m.emissive.copy(u.e0).lerp(u.glowCol, Math.min(1, u.glow) * 0.6); m.emissiveIntensity = u.ei + u.glow * (0.45 + 0.25 * Math.sin(t * 3)); }
        else { m.emissive.copy(u.e0); m.emissiveIntensity = u.ei; }
      }
    });
    if (flight) {
      var s = Math.min(1, (performance.now() - flight.start) / flight.ms), e = s < 0.5 ? 4 * s * s * s : 1 - Math.pow(-2 * s + 2, 3) / 2;
      camera.position.lerpVectors(flight.p0, flight.p1, e); controls.target.lerpVectors(flight.t0, flight.t1, e);
      if (s >= 1) flight = null;
    }
    controls.update();
    renderer.render(scene, camera);
    // labels
    var r = canvas.getBoundingClientRect(), placed = [];
    TAGS.forEach(function (tg) {
      var show = tg.stage.indexOf(stage) >= 0 && introDone && (!focusLayer || focusLayer === tg.layer || stage === 3);
      tmpV.set(U(tg.pos[0]), tg.pos[2], Z(tg.pos[1])); tmpV.y += tg.group.position.y + root.position.y;
      tmpV.project(camera);
      var vis = show && tmpV.z < 1 && Math.abs(tmpV.x) < 1.05 && Math.abs(tmpV.y) < 1.05;
      var px = (tmpV.x * 0.5 + 0.5) * r.width, py = (-tmpV.y * 0.5 + 0.5) * r.height;
      if (vis) {
        var w = (tg.w = tg.w || tg.el.offsetWidth || 120) / 2 + 4, h = 17;
        vis = !placed.some(function (b) { return Math.abs(b.x - px) < b.w + w && Math.abs(b.y - py) < h * 2; });
        if (vis) placed.push({ x: px, y: py, w: w });
      }
      tg.el.classList.toggle("hide", !vis);
      if (vis) tg.el.style.transform = "translate(" + px.toFixed(1) + "px," + py.toFixed(1) + "px) translate(-50%,-50%)";
    });
    var az = THREE.MathUtils.radToDeg(controls.getAzimuthalAngle()), po = THREE.MathUtils.radToDeg(controls.getPolarAngle());
    hudRot.textContent = String(Math.round((az + 360) % 360)).padStart(3, "0") + "°";
    hudTilt.textContent = String(Math.round(90 - po)).padStart(2, "0") + "°";
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function toCarotid() {
    setFocus("carotid");
    // the patient's right sheath (+x here), from the front and the side, at the split above the slab
    fly(new THREE.Vector3(5.2, 3.6, 5.4), new THREE.Vector3(0.95, 1.15, 0.45), 1700);
  }
  window.__neck = { setStage: function (n) { applyStage(n); } };

  /* ───── lesson ───── */
  var page = document.getElementById("page");
  function chip(layer, text) { return '<button type="button" class="chip" data-layer="' + layer + '" style="--c:' + COL[layer] + '" aria-pressed="false">' + text + "</button>"; }
  function recall(q, a) { return '<div class="card recall"><div class="cap"><span>Cover it · answer in your head</span><span lang="ar" dir="rtl">رجّعها من دماغك</span></div><p class="q">' + q + '</p><p class="answer">' + a + '</p><div class="row-btns"><button type="button" class="ghost" data-r="show">Show the answer</button></div></div>'; }
  var SECTIONS = [
    { label: "The whole picture",
      html: '<h1>Deep cervical <span class="grad">fascia</span></h1><div class="ar" dir="rtl" lang="ar">فرّق النسيج<small dir="ltr">Read the tissue</small></div>' +
        '<p class="lede">The neck is packed in <i>sleeves of deep fascia</i>. The ' + chip("investing", "investing layer") + ' wraps everything like a collar and splits around the sternomastoid and trapezius. The ' + chip("pretracheal", "pretracheal layer") + ' wraps the thyroid, trachea and oesophagus. The ' + chip("prevertebral", "prevertebral layer") + ' covers the muscles in front of the spine. The ' + chip("carotid", "carotid sheath") + ' is a tube around the main vessels and the vagus. Each layer decides where pus spreads and what moves with swallowing.</p>' +
        '<div class="card" style="--cc:var(--text-3)"><div class="cap"><span>Try it</span></div><p>Drag the model to turn it. Tap any part to name it, or tap a coloured word to light up its sleeve.</p></div>' },
    { label: "Layers of deep cervical fascia",
      html: '<h2>Four sleeves, <span class="grad">four jobs</span></h2><div class="layers">' +
        [["superficial", "Superficial fascia", "Contains the platysma, the external jugular vein and the cutaneous nerves."],
         ["investing", "Investing layer", "Splits to enclose the sternomastoid and trapezius. Roof of the posterior triangle; capsules of the parotid and submandibular glands; attached to the hyoid."],
         ["pretracheal", "Pretracheal layer", "Encloses the thyroid, trachea, oesophagus and infrahyoid muscles. Attached to the hyoid and thyroid cartilage, so the thyroid moves up with swallowing."],
         ["prevertebral", "Prevertebral layer", "Covers the prevertebral and scalene muscles. Floor of the posterior triangle; prolonged into the axilla as the axillary sheath."]].map(function (r) {
          return '<button type="button" class="layer" data-layer="' + r[0] + '" aria-pressed="false" style="--c:' + COL[r[0]] + '"><span class="orb"></span><span><b>' + r[1] + "</b><span>" + r[2] + "</span></span></button>";
        }).join("") + "</div>" +
        '<div class="card" style="--cc:var(--pretracheal)"><div class="cap"><span>Written exam asks</span><span lang="ar" dir="rtl">السؤال المقالي</span></div><p>List the contents of the posterior triangle of the neck, and the external jugular vein.</p></div>' +
        recall("Which fascial layer makes the thyroid move with swallowing?", "The <b>pretracheal fascia</b>, attached to the hyoid and the thyroid cartilage.") },
    { label: "Carotid sheath",
      html: '<h2>The carotid <span class="grad">sheath</span></h2><p class="lede">A fascial tube from the base of the skull to the root of the neck. Watch the common carotid split at C4: the internal carotid stays inside, the external carotid leaves.</p>' +
        '<div class="cols"><div style="--c:var(--carotid)"><h3>Inside</h3><ul><li><b>Common and internal carotid</b>, medially</li><li><b>Internal jugular vein</b>, laterally</li><li><b>Vagus nerve</b>, between and behind</li><li>Deep cervical lymph nodes</li></ul></div>' +
        '<div style="--c:var(--text-3)"><h3>Not inside</h3><ul><li><b>External carotid</b>, outside</li><li>External jugular vein</li><li><b>Ansa cervicalis</b>, in the front wall</li><li><b>Sympathetic trunk</b>, behind</li></ul></div></div>' +
        '<div class="card" style="--cc:var(--artery)"><div class="cap"><span>Exam trap</span></div><p>The <b>external</b> carotid is <b>not</b> in the carotid sheath. The <b>internal</b> carotid is.</p></div>' +
        recall("What are the contents of the carotid sheath?", "The common and internal carotid arteries, the internal jugular vein and the vagus nerve, with the deep cervical nodes.") },
    { label: "Lesson complete",
      html: '<h2>Lesson <span class="grad">complete</span></h2><p class="lede">Three sections, four sleeves, one sheath. Next on today\'s plan: <b>Cerebellum physiology</b>.</p><div class="card" style="--cc:var(--prevertebral)"><div class="cap"><span>+15 XP</span></div><p>In the course this step would now count as done.</p></div>' }
  ];
  var cur = 0;
  var ctaT = document.getElementById("cta-t"), ctaS = document.getElementById("cta-s"), metaL = document.getElementById("meta-l");
  function render(i) {
    page.innerHTML = SECTIONS[i].html;
    metaL.textContent = i < 3 ? "Section " + (i + 1) + " of 3 · " + SECTIONS[i].label : "Done";
    ctaT.textContent = i < 2 ? "Got it, next section" : i === 2 ? "Finish the lesson" : "Start again";
    ctaS.textContent = i < 2 ? "Next: " + SECTIONS[i + 1].label : i === 2 ? "Wraps up this lesson" : "From the whole picture";
    ["s1", "s2", "s3"].forEach(function (id, k) { document.getElementById(id).style.setProperty("--p", k < i ? 1 : k === i ? 0.35 : 0); });
  }
  function applyStage(n) {
    stage = n;
    if (n === 1) { setExplode(false); setFocus(null); fly(HOME.pos, HOME.target, 1300); }
    if (n === 2) { setFocus(null); setExplode(true); }
    if (n === 3) { setExplode(false); toCarotid(); }
    if (n === 4) { setFocus(null); setExplode(false); fly(new THREE.Vector3(-5.2, 6.4, 9.2), HOME.target, 1800); controls.autoRotate = !reduce; controls.autoRotateSpeed = 2.4; setTimeout(function () { controls.autoRotateSpeed = 0.55; }, 2600);
      ["prevertebral", "carotid", "pretracheal", "investing"].forEach(function (k, i) { setTimeout(function () { setFocus(k); }, 300 + i * 420); }); setTimeout(function () { setFocus(null); }, 300 + 4 * 420); }
  }
  page.addEventListener("click", function (e) {
    var b = e.target.closest("[data-r]"); if (!b) return;
    var box = b.closest(".recall"), r = b.getAttribute("data-r"), row = box.querySelector(".row-btns");

  });

  });
  document.getElementById("cta").addEventListener("click", function () {
    var next = cur === 3 ? 0 : cur + 1;
    page.classList.add("out");
    setTimeout(function () { cur = next; render(cur); page.classList.remove("out"); document.querySelector(".panel").scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" }); }, reduce ? 0 : 280);
    applyStage(next + 1);
  });
  render(0);

  function start2D() { /* without 3D the lesson still works */ }
})();
