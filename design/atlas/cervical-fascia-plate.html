<style>
/* Layout: an open anatomical atlas. Left page: the engraved, hand-coloured plate, its caption and the
   myelinated axon that records progress. Right page: the lesson, with the call to go on always in reach.
   One committed dark world: the ink of an intaglio plate, lines in bone, each fascial layer in a pigment. */
:root {
  color-scheme: dark;
  --ink: #0a0b11;
  --ink-2: #10121a;
  --bone: #ece2cc;
  --bone-2: #bdb29c;
  --bone-3: #847b6b;
  --hair: rgba(236, 226, 204, 0.14);
  --hair-2: rgba(236, 226, 204, 0.28);
  --gilt: #dcab52;
  --madder: #dc7187;
  --verdigris: #63baa6;
  --lapis: #89a5f2;
  --artery: #e3685c;
  --vein: #5f7bc6;
  --nerve: #f2da8e;
  --display: "Bodoni Moda", "Bodoni 72", Didot, "Times New Roman", serif;
  --body: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --arabic: "Amiri", "Geeza Pro", "Noto Naskh Arabic", serif;
  --ease: cubic-bezier(0.2, 0.7, 0.1, 1);
}
html { background: var(--ink); }
body {
  background: var(--ink);
  color: var(--bone);
  font: 400 17px/1.62 var(--body);
  margin: 0;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
/* atmosphere: a reading lamp that drifts toward your hand, a vignette, paper grain */
.atmos { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.lamp { position: absolute; left: -12%; top: -22%; width: 82%; height: 115%; transform: translate(var(--lx, 0px), var(--ly, 0px)); transition: transform 1.6s var(--ease); }
.lamp::before { content: ""; position: absolute; inset: 0; background: radial-gradient(closest-side, rgba(220, 171, 82, 0.14), rgba(220, 171, 82, 0.045) 55%, transparent 76%); animation: lamp 16s ease-in-out infinite alternate; }
.atmos::after {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(0, 0, 0, 0.55) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .92  0 0 0 0 .88  0 0 0 0 .8  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  opacity: 0.09; mix-blend-mode: screen;
}
@keyframes lamp { from { transform: scale(1); opacity: 0.85; } to { transform: scale(1.07); opacity: 1; } }

.wrap { position: relative; z-index: 1; max-width: 1320px; margin: 0 auto; }

/* masthead */
.mast { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 18px; padding-block: 16px 12px; border-bottom: 1px solid var(--hair); }
.menu { width: 40px; height: 40px; display: grid; place-items: center; background: none; border: 1px solid var(--hair); border-radius: 2px; color: var(--bone); cursor: pointer; }
.menu svg { width: 18px; height: 18px; }
.mark { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
.mark b { font: 500 21px/1 var(--display); letter-spacing: 0.16em; text-transform: uppercase; white-space: nowrap; }
.mark span { color: var(--bone-3); font-size: 13px; letter-spacing: 0.08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.today { display: flex; align-items: center; gap: 10px; color: var(--bone-2); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.today svg { width: 30px; height: 30px; transform: rotate(-90deg); }

/* the spread */
.spread { display: grid; grid-template-columns: minmax(0, 1.36fr) minmax(0, 1fr); gap: clamp(24px, 3.2vw, 52px); padding-block: 22px 0; align-items: start; }
.leaf-plate { position: sticky; top: 14px; display: grid; gap: 14px; }
.plate { margin: 0; position: relative; padding: 14px; }
.plate::before { content: ""; position: absolute; inset: 0; border: 1px solid rgba(220, 171, 82, 0.42); pointer-events: none; }
.plate::after { content: ""; position: absolute; inset: 6px; border: 1px solid rgba(220, 171, 82, 0.16); pointer-events: none; }
.tick { position: absolute; width: 14px; height: 14px; border-color: var(--gilt); border-style: solid; opacity: 0.9; }
.tick.tl { left: -7px; top: -7px; border-width: 1px 0 0 1px; }
.tick.tr { right: -7px; top: -7px; border-width: 1px 1px 0 0; }
.tick.bl { left: -7px; bottom: -7px; border-width: 0 0 1px 1px; }
.tick.br { right: -7px; bottom: -7px; border-width: 0 1px 1px 0; }
#plate { display: block; width: 100%; height: auto; max-width: 100%; overflow: hidden; touch-action: pan-y; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
#sparks { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
.plate figcaption { display: grid; gap: 4px; padding: 12px 6px 2px; border-top: 1px solid var(--hair); margin-top: 6px; }
.fig { font: italic 400 14px/1.45 var(--display); color: var(--bone-2); }
.fig b { font-style: normal; font-weight: 600; letter-spacing: 0.12em; font-size: 11px; color: var(--gilt); margin-right: 8px; }
#fact { font: 400 15px/1.5 var(--body); color: var(--bone); min-height: 3em; transition: color 0.4s; }
#fact i { font-family: var(--display); font-size: 16px; }
.sculp { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font: italic 400 12.5px/1.3 var(--display); color: var(--bone-3); letter-spacing: 0.04em; }
.hint { font: 500 12px/1.3 var(--body); letter-spacing: 0.06em; color: var(--bone-3); font-style: normal; }

/* the loupe's name card */
#tip { position: absolute; left: 0; top: 0; z-index: 4; pointer-events: none; transform: translate(-50%, calc(-100% - 16px)); opacity: 0; transition: opacity 0.25s; max-width: 260px;
  padding: 9px 13px 10px; background: rgba(10, 11, 17, 0.92); border: 1px solid rgba(220, 171, 82, 0.55); box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5); }
#tip.on { opacity: 1; }
#tip b { display: block; font: italic 500 17px/1.2 var(--display); color: var(--bone); }
#tip span { display: block; font: 400 13px/1.4 var(--body); color: var(--bone-2); margin-top: 4px; }
#tip span:empty { display: none; }

/* engraving */
#plate text { font-family: var(--display); }
.lbl { font-style: italic; font-size: 18px; fill: var(--bone); }
.lbl-cap { font-style: normal; font-size: 11px; letter-spacing: 0.22em; fill: var(--bone-3); }
.zl { font-style: italic; font-size: 5px; fill: var(--bone); }
.zl-cap { font-style: normal; font-size: 3.3px; letter-spacing: 0.22em; fill: var(--lapis); }
.lead { fill: none; stroke: var(--bone-2); stroke-width: 0.7; }
.zlead { fill: none; stroke: var(--bone-2); stroke-width: 0.25; }
.lay { transition: opacity 0.55s var(--ease); cursor: pointer; }
#plate.focusing .lay { opacity: 0.14; }
#plate.focusing .lay.on { opacity: 1; }
#plate .lay.on .gl { filter: url(#glow); }
.labs, .zlabs, .lab { transition: opacity 0.6s var(--ease); }
.lab.off, .labs.off, .zlabs.off { opacity: 0; pointer-events: none; }
#plate.focusing .lab:not(.on) { opacity: 0.2; }
.loupe { pointer-events: none; }
#plate.compact .labs { display: none; }

/* the ink draws itself on arrival */
.ink { stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: ink 1.5s var(--ease) var(--d, 0s) forwards; }
.wash { opacity: 0; animation: wash 1.1s ease var(--d, 0s) forwards; }
@keyframes ink { to { stroke-dashoffset: 0; } }
@keyframes wash { to { opacity: 1; } }
.swallow { transform-box: fill-box; transform-origin: center; animation: swallow 1.6s var(--ease) 2; }
@keyframes swallow { 0%, 100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-5px) scale(1.04); } }
.wave { transform-box: fill-box; transform-origin: center; animation: wave 1.5s cubic-bezier(0.1, 0.6, 0.2, 1) forwards; }
@keyframes wave { from { transform: scale(0.04); opacity: 0.85; } to { transform: scale(1.7); opacity: 0; } }
.bloom { animation: bloom 0.9s var(--ease); }
@keyframes bloom { 0% { filter: none; } 35% { filter: url(#glow) brightness(1.6); } 100% { filter: none; } }

/* the lesson page */
.leaf-text { min-width: 0; display: grid; gap: 26px; }
.page { display: grid; gap: 22px; transition: opacity 0.28s ease, transform 0.36s var(--ease); }
.page.out { opacity: 0; transform: translateY(12px); }
.eyebrow { font: 600 11.5px/1.3 var(--body); letter-spacing: 0.22em; text-transform: uppercase; color: var(--gilt); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.eyebrow::after { content: ""; flex: 1 1 40px; height: 1px; background: linear-gradient(90deg, rgba(220, 171, 82, 0.5), transparent); }
h1, h2 { font-family: var(--display); font-weight: 500; text-wrap: balance; margin: 0; color: var(--bone); }
h1 { font-size: clamp(42px, 5.4vw, 74px); line-height: 0.98; letter-spacing: -0.015em; }
h2 { font-size: clamp(34px, 4vw, 52px); line-height: 1.02; letter-spacing: -0.01em; }
h1 em, h2 em { font-style: italic; color: var(--gilt); font-weight: 400; }
.ar { display: inline-flex; align-items: baseline; gap: 12px; color: var(--bone-2); font-size: 13px; letter-spacing: 0.06em; }
.ar [lang="ar"] { font: 700 24px/1 var(--arabic); color: var(--bone); letter-spacing: 0; }
.lede { font-size: 19px; line-height: 1.66; max-width: 34em; margin: 0; color: var(--bone); }
.lede i { font-family: var(--display); font-size: 1.08em; }
.meta { font-size: 13px; color: var(--bone-3); letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
.term { font: inherit; font-weight: 600; color: var(--c); background: none; border: 0; padding: 0 1px; cursor: pointer;
  text-decoration: underline; text-decoration-style: dotted; text-decoration-thickness: 1.5px; text-underline-offset: 4px; transition: text-shadow 0.3s, color 0.3s; }
.term:hover, .term[aria-pressed="true"] { text-shadow: 0 0 18px var(--c); text-decoration-style: solid; }
.term:focus-visible, button:focus-visible { outline: 1px solid var(--gilt); outline-offset: 3px; }
.key { display: grid; border-top: 1px solid var(--hair); }
.key button { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 14px; align-items: center; text-align: left; padding: 12px 2px; background: none; border: 0; border-bottom: 1px solid var(--hair); color: var(--bone); font: 500 16px/1.3 var(--body); cursor: pointer; transition: background 0.3s; }
.key button:hover, .key button[aria-pressed="true"] { background: linear-gradient(90deg, rgba(236, 226, 204, 0.05), transparent); }
.sw { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c) 70%, white), var(--c) 55%, color-mix(in srgb, var(--c) 55%, black)); box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4), 0 0 18px -4px var(--c); }
.key .pig { font: italic 400 15px/1 var(--display); color: var(--bone-3); }
.rows { display: grid; border-top: 1px solid var(--hair); }
.row { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--hair); }
.row .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-top: 9px; box-shadow: 0 0 14px var(--c); }
.row p { margin: 0; color: var(--bone-2); font-size: 16px; }
.row p strong { color: var(--bone); font-weight: 600; }
.note { position: relative; padding: 18px 20px; border: 1px solid var(--hair); background: linear-gradient(180deg, rgba(236, 226, 204, 0.035), rgba(236, 226, 204, 0.01)); }
.note::before, .note::after { content: ""; position: absolute; width: 9px; height: 9px; border-color: var(--nc, var(--gilt)); border-style: solid; }
.note::before { left: -1px; top: -1px; border-width: 1px 0 0 1px; }
.note::after { right: -1px; bottom: -1px; border-width: 0 1px 1px 0; }
.note .cap { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font: 600 11px/1.2 var(--body); letter-spacing: 0.2em; text-transform: uppercase; color: var(--nc, var(--gilt)); margin-bottom: 10px; }
.note .cap [lang="ar"] { font: 700 19px/1 var(--arabic); letter-spacing: 0; text-transform: none; color: var(--bone-2); }
.note p { margin: 0; }
.q { font: 500 22px/1.3 var(--display); color: var(--bone); margin: 0 0 14px; text-wrap: balance; }
.answer { font-size: 17px; color: var(--bone); filter: blur(7px); opacity: 0.55; transition: filter 0.7s var(--ease), opacity 0.7s; user-select: none; }
.revealed .answer { filter: none; opacity: 1; user-select: text; }
.recall-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: center; }
.btn-line { font: 500 15px/1 var(--body); color: var(--bone); background: rgba(236, 226, 204, 0.04); border: 1px solid var(--hair-2); padding: 12px 18px; cursor: pointer; border-radius: 1px; transition: border-color 0.3s, background 0.3s; }
.btn-line:hover { border-color: var(--gilt); background: rgba(220, 171, 82, 0.08); }
.verdict { font: italic 400 16px/1.3 var(--display); }
.lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
.lists h3 { font: 600 11px/1.2 var(--body); letter-spacing: 0.2em; text-transform: uppercase; margin: 0 0 8px; color: var(--c); }
.lists ul { margin: 0; padding-left: 18px; color: var(--bone-2); font-size: 16px; display: grid; gap: 6px; }
.lists li strong { color: var(--bone); font-weight: 600; }

/* the call to go on: it stays in reach while the page scrolls under it */
.go { position: sticky; bottom: 0; z-index: 5; padding-top: 30px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); margin-top: -12px;
  background: linear-gradient(to top, var(--ink) 62%, rgba(10, 11, 17, 0)); }
.cta { position: relative; overflow: hidden; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px; width: 100%; text-align: left;
  padding: 19px 24px; cursor: pointer; color: #1a1206; border: 0; border-radius: 1px;
  background: linear-gradient(115deg, #f0cd83 0%, var(--gilt) 42%, #b98a3c 100%);
  box-shadow: 0 1px 0 rgba(255, 240, 200, 0.6) inset, 0 18px 40px -18px rgba(220, 171, 82, 0.7); transition: transform 0.25s var(--ease), box-shadow 0.3s; }
.cta:hover { transform: translateY(-1px); box-shadow: 0 1px 0 rgba(255, 240, 200, 0.6) inset, 0 24px 50px -18px rgba(220, 171, 82, 0.85); }
.cta:active { transform: translateY(1px) scale(0.995); }
.cta::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255, 252, 240, 0.55) 50%, transparent 65%); transform: translateX(-120%); animation: sheen 5.5s ease-in-out 2.4s infinite; }
@keyframes sheen { 0%, 70% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
.cta b { font: 600 22px/1.1 var(--display); letter-spacing: 0.01em; }
.cta small { display: block; font: 600 11px/1.2 var(--body); letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.7; margin-top: 6px; }
.cta [lang="ar"] { font: 700 22px/1 var(--arabic); }

/* the axon */
.axon { display: grid; gap: 4px; position: relative; padding: 0 4px; }
.axon-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 11.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--bone-3); }
.axon-head em { font: italic 400 15px/1 var(--display); letter-spacing: 0; text-transform: none; color: var(--bone-2); }
#axon { width: 100%; height: auto; max-width: 100%; display: block; overflow: visible; }
#axon .my { fill: rgba(236, 226, 204, 0.07); stroke: rgba(236, 226, 204, 0.22); stroke-width: 0.8; transition: fill 0.4s, stroke 0.4s; }
#axon .my.lit { fill: rgba(220, 171, 82, 0.2); stroke: rgba(220, 171, 82, 0.75); }
#axon .core { stroke: rgba(236, 226, 204, 0.3); stroke-width: 1.2; }
#axon .node { fill: var(--ink); stroke: var(--bone-3); stroke-width: 1.2; transition: fill 0.3s, stroke 0.3s; }
#axon .node.big { stroke-width: 1.6; }
#axon .node.lit { fill: var(--gilt); stroke: var(--gilt); }
#axon text { font: italic 400 13px var(--display); fill: var(--bone-3); }
#axon text.lit { fill: var(--gilt); }
.toast { position: absolute; right: 4px; top: -3px; font: italic 500 17px/1 var(--display); color: var(--gilt); opacity: 0; transform: translateY(8px); transition: opacity 0.4s, transform 0.6s var(--ease); pointer-events: none; white-space: nowrap; }
.toast.on { opacity: 1; transform: translateY(0); }
.axon-head em { transition: opacity 0.3s; }
.axon.toasting .axon-head em { opacity: 0; }

.colophon { position: relative; z-index: 1; max-width: 1320px; margin: 0 auto; padding-block: 18px 30px; border-top: 1px solid var(--hair); color: var(--bone-3); font-size: 13px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.colophon i { font-family: var(--display); }

@media (max-width: 960px) {
  .spread { grid-template-columns: minmax(0, 1fr); }
  .leaf-plate { position: relative; top: 0; }
}
@media (max-width: 560px) {
  .mark span { display: none; }
  .mast { gap: 12px; }
  .mark { overflow: hidden; }
  .mark b { font-size: 16px; letter-spacing: 0.1em; }
  .today span { display: none; }
  .lede { font-size: 17.5px; }
  .cta { padding: 17px 18px; }
  .cta b { font-size: 20px; }
  .plate { padding: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .lamp::before, .cta::after, .swallow, .bloom { animation: none; }
  .lamp { transition: none; }
  .ink { animation: none; stroke-dasharray: none; stroke-dashoffset: 0; }
  .wash { animation: none; opacity: 1; }
  .wave { display: none; }
  .page, .lay, .lab, .labs, .zlabs, .answer, .cta { transition: none; }
}
</style>

        '<div class="key" role="group" aria-label="The plate\'s colouring">' +
        [["investing", "Investing layer", "Gilt"], ["pretracheal", "Pretracheal layer", "Rose madder"], ["prevertebral", "Prevertebral layer", "Verdigris"], ["carotid", "Carotid sheath", "Lapis lazuli"]].map(function (r) {
          return '<button type="button" data-layer="' + r[0] + '" aria-pressed="false" style="--c:' + COLOR[r[0]] + '"><span class="sw"></span><span>' + r[1] + '</span><span class="pig">' + r[2] + "</span></button>";
        }).join("") + "</div>" +
        '<div class="meta">Anatomy · exam tier C · 4 sources · about 15 minutes</div>' },
    { cap: "Section II of III", next: "Got it · next section",
      html: '<div class="eyebrow">Section II of III · Layers of deep cervical fascia</div>' +
        '<h2>Four sleeves, <em>four jobs</em></h2>' +
        '<div class="rows">' +
        [["superficial", "Superficial fascia", "contains the <strong>platysma</strong>, the external jugular vein and the cutaneous nerves."],
         ["investing", "Investing layer", "surrounds the neck and <strong>splits to enclose the sternomastoid and trapezius</strong>. It forms the <strong>roof of the posterior triangle</strong> and the capsules of the parotid and submandibular glands, and it is attached to the hyoid bone."],
         ["pretracheal", "Pretracheal layer", "encloses the <strong>thyroid gland</strong>, trachea, oesophagus and infrahyoid muscles. It is attached to the hyoid and the thyroid cartilage, so the <strong>thyroid moves up with swallowing</strong>."],
         ["prevertebral", "Prevertebral layer", "covers the prevertebral and scalene muscles and forms the <strong>floor of the posterior triangle</strong>. It is prolonged into the axilla as the <strong>axillary sheath</strong> around the subclavian artery and brachial plexus."]].map(function (r) {
          return '<div class="row" style="--c:' + COLOR[r[0]] + '"><span class="dot"></span><p>' + T(r[0], r[1]) + ": " + r[2] + "</p></div>";
        }).join("") + "</div>" +
        '<div class="note" style="--nc:var(--madder)"><div class="cap"><span>The written exam asks this section as</span><span lang="ar" dir="rtl">السؤال المقالي</span></div><p>List the contents of the posterior triangle of the neck, and the external jugular vein. Answer it in your head as headings from the points above before you go on.</p></div>' +
        RECALL("Which fascial layer makes the thyroid move with swallowing?", "The <strong>pretracheal fascia</strong>, attached to the hyoid and the thyroid cartilage."),
      onReveal: function () { focus("pretracheal", true); swallowG.classList.remove("swallow"); void swallowG.getBBox(); swallowG.classList.add("swallow"); } },
    { cap: "Section III of III", next: "Finish the plate",
      html: '<div class="eyebrow">Section III of III · Carotid sheath</div>' +
        '<h2>The carotid <em>sheath</em></h2>' +
        '<p class="lede">A fascial tube from the base of the skull to the root of the neck. The plate has moved in on the left one.</p>' +
        '<div class="lists"><div style="--c:var(--lapis)"><h3>Inside</h3><ul><li>The <strong>common and internal carotid arteries</strong>, medially</li><li>The <strong>internal jugular vein</strong>, laterally</li><li>The <strong>vagus nerve</strong>, between and behind them</li><li>Deep cervical lymph nodes</li></ul></div>' +
        '<div style="--c:var(--bone-2)"><h3>Not inside</h3><ul><li>The <strong>external carotid artery</strong>, outside the sheath</li><li>The external jugular vein</li><li>The <strong>ansa cervicalis</strong>, in the anterior wall, not inside it</li><li>The <strong>sympathetic trunk</strong>, behind the sheath</li></ul></div></div>' +
        '<div class="note" style="--nc:var(--artery)"><div class="cap"><span>Exam trap</span></div><p>The <strong>external</strong> carotid is <strong>not</strong> in the carotid sheath. The <strong>internal</strong> carotid is.</p></div>' +
        RECALL("What are the contents of the carotid sheath?", "The common and internal carotid arteries, the internal jugular vein and the vagus nerve, with the deep cervical nodes.") },
    { cap: "Lesson complete", next: "See the plate again",
      html: '<div class="eyebrow">Lesson complete</div>' +
        '<h2>Plate XXIX, <em>learned.</em></h2>' +

  ];

  var page = document.getElementById("page");
  var ctaEn = document.getElementById("cta-en"), ctaSub = document.getElementById("cta-sub"), capEl = document.getElementById("axon-cap"), toast = document.getElementById("toast");
  function render(i) {
    var s = SECTIONS[i];
    page.innerHTML = s.html;
    ctaEn.textContent = s.next;
    ctaSub.textContent = i < 3 ? s.cap + " · tap when it is clear" : "Starts the lesson again";
    capEl.textContent = i < 3 ? "Node " + ["I", "II", "III"][i] + " of III" : "Fired end to end";
  }
  function setStage(n) {
    stage = n;
    Array.prototype.forEach.call(svg.querySelectorAll(".lab"), function (g0) {
      var off = Number(g0.getAttribute("data-stage")) > Math.min(n, 2);
      var was = g0.classList.contains("off");
      g0.classList.toggle("off", off);
      if (was && !off) redraw(g0);
    });
    if (n === 3) {
      labs.classList.add("off"); zl.classList.remove("off");
      focus("carotid", true); camera(ZOOM, 1700);
      fact.innerHTML = "<i>Close-up, left carotid sheath.</i> Vein lateral, artery medial, vagus between and behind; the ansa sits in the wall, the sympathetic trunk outside it.";
    } else {
      labs.classList.remove("off"); zl.classList.add("off");
      if (VB[2] !== 860) camera([0, 0, 860, 560], 1300);
      focus(null, true);
    }
  }
  page.addEventListener("click", function (e) {
    var b = e.target.closest("[data-recall]");
    if (!b) return;
    var box = b.closest(".recall"), act = b.getAttribute("data-recall"), acts = box.querySelector(".recall-actions");
    if (act === "show") {
      box.classList.add("revealed");
      acts.innerHTML = '<button type="button" class="btn-line" data-recall="yes">I had it</button><button type="button" class="btn-line" data-recall="no">Not yet</button>';
      if (SECTIONS[cur].onReveal) SECTIONS[cur].onReveal();
    } else {
      acts.innerHTML = '<span class="verdict" style="color:' + (act === "yes" ? "var(--verdigris)" : "var(--madder)") + '">' + (act === "yes" ? "Locked in." : "It comes back once before practice.") + "</span>";
    }
  });

  var cur = 0, busy = false;
  document.getElementById("cta").addEventListener("click", function () {
    if (busy) return;
    busy = true;
    if (cur === 3) {
      cur = 0;
      spark.setAttribute("cx", NODES[0]); halo.setAttribute("cx", NODES[0]); lightTo(0);
      turn(0); setStage(1);
      Array.prototype.forEach.call(svg.querySelectorAll(".lab"), function (g0) { if (g0.getAttribute("data-stage") === "1") redraw(g0); });
      busy = false;
      return;
    }
    toast.classList.add("on"); toast.parentNode.classList.add("toasting");
    setTimeout(function () { toast.classList.remove("on"); toast.parentNode.classList.remove("toasting"); }, 1700);
    var next = cur + 1;
    turn(next);
    conduct(SEC[cur], SEC[next], function () {
      if (next === 1) { setStage(2); burst(430, 280, 70, GILT); ["investing", "pretracheal", "prevertebral", "carotid"].forEach(function (l, i) { setTimeout(function () { bloomLayer(l); }, i * 140); }); }
      else if (next === 2) { burst(332, 228, 60, "rgba(160,185,255,"); setTimeout(function () { setStage(3); }, 250); }
      else { setStage(2); setTimeout(function () { burst(430, 280, 140, GILT); }, 600); ["investing", "pretracheal", "prevertebral", "carotid"].forEach(function (l, i) { setTimeout(function () { bloomLayer(l); }, 900 + i * 260); }); }
      busy = false;
    });
    cur = next;
  });
  function turn(i) {
    page.classList.add("out");
    setTimeout(function () {
      render(i);
      page.classList.remove("out");
      var top = page.getBoundingClientRect().top;
      if (top < 0 || top > innerHeight * 0.6) page.scrollIntoView({ block: "start", behavior: reduce ? "auto" : "smooth" });
    }, reduce ? 0 : 300);
  }
  function fit() {
    var w = svg.getBoundingClientRect().width, compact = w < 560;
    svg.classList.toggle("compact", compact);
    var hint = fact.querySelector(".hint");
    if (hint) hint.textContent = compact ? "Tap any structure to name it; press and hold to look closer." : "Press and hold the plate to look closer.";
    DEFAULT_FACT = fact.innerHTML.indexOf("hint") > -1 && !focused ? fact.innerHTML : DEFAULT_FACT;
  }
  fit();
  if (window.ResizeObserver) new ResizeObserver(fit).observe(svg); else addEventListener("resize", fit);
  render(0);
})();
</script>
