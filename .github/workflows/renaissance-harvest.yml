name: Renaissance World Harvester

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Target capability id from tools/harvester/targets.json"
        default: "natural-selection"
        required: true
      commit:
        description: "Commit the verified harvest to this branch"
        type: boolean
        default: false
  push:
    branches:
      - renaissance/standalone-v1
    paths:
      - ".github/renaissance-harvest-live-trigger.txt"

permissions:
  contents: write

concurrency:
  group: renaissance-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve event inputs safely
        shell: bash
        run: |
          set -euo pipefail
          TARGET="natural-selection"
          AUTO_COMMIT="false"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            v="$(jq -r '.inputs.target // empty' "$GITHUB_EVENT_PATH")"
            [ -n "$v" ] && TARGET="$v"
            c="$(jq -r '.inputs.commit // "false"' "$GITHUB_EVENT_PATH")"
            [ "$c" = "true" ] && AUTO_COMMIT="true"
          else
            AUTO_COMMIT="true"
          fi
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "AUTO_COMMIT=$AUTO_COMMIT" >> "$GITHUB_ENV"
          echo "Resolved target=$TARGET auto_commit=$AUTO_COMMIT"

      - name: Gates before touching the network
        run: |
          node tests/reader_os_test.js
          node tests/campus_test.js
          node tests/harvester_test.js

      - name: "Harvest live (polite: identifying User-Agent, maxlag, one request at a time)"
        run: node tools/harvester/harvest.mjs --live --target "$TARGET"

      - name: "Verify the harvest from scratch (same gates the page runs)"
        run: node tools/harvester/verify_harvest.mjs

      - name: Keep the verified result as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: harvest-${{ env.TARGET }}
          path: source/public/harvest

      - name: Commit verified harvest when requested or automation-triggered
        if: env.AUTO_COMMIT == 'true'
        run: |
          git config user.name "renaissance-harvester"
          git config user.email "renaissance-harvester@users.noreply.github.com"
          git add source/public/harvest
          git diff --cached --quiet && { echo "nothing new to commit"; exit 0; }
          git commit -m "renaissance harvest: $TARGET (verified live candidates; nothing self-certified)"
          git push
